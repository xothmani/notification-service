spring.application.name=notification-service

# Server port
server.port=8085

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/notification_db

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# Set INTERNAL_TOKEN environment variable in production — never commit real secrets
internal.token=${INTERNAL_TOKEN:dev-only-change-in-production}
