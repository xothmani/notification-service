spring.application.name=notification-service

# Server port
server.port=8085

# MongoDB — includes connect, socket, and server-selection timeouts so a slow
# or unresponsive MongoDB fails fast instead of hanging request threads.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/notification_db?connectTimeoutMS=2000&socketTimeoutMS=5000&serverSelectionTimeoutMS=3000}

# Redis — timeout applies to individual command execution;
# connect-timeout applies to initial connection establishment.
# Both are short so a Redis outage falls back to MongoDB quickly.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.data.redis.lettuce.shutdown-timeout=100ms
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=2

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# Set INTERNAL_TOKEN environment variable in production — never commit real secrets
internal.token=${INTERNAL_TOKEN:dev-only-change-in-production}

# Actuator — expose health endpoint only; full details for ops dashboards
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Swagger / OpenAPI — exclude /actuator from the API docs
springdoc.paths-to-exclude=/actuator/**

# Messaging service — used by MessagingDeliveryService for EMAIL/SMS delivery
messaging.service.url=${MESSAGING_SERVICE_URL:http://localhost:8080}
messaging.service.shared-secret=${PUBLIC_API_SHARED_SECRET:dev-shared-secret-change-me}

# Redis Streams
redis.stream.key=notifications_stream
redis.stream.consumer-group=notification-group
redis.stream.consumer-name=worker-${HOSTNAME:local}
