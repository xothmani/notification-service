spring.application.name=notification-service

# Server port
server.port=8085

# MongoDB — includes connect, socket, and server-selection timeouts so a slow
# or unresponsive MongoDB fails fast instead of hanging request threads.
spring.data.mongodb.uri=mongodb://localhost:27017/notification_db?connectTimeoutMS=2000&socketTimeoutMS=5000&serverSelectionTimeoutMS=3000&maxPoolSize=100&minPoolSize=10&waitQueueTimeoutMS=2000

# Redis — timeout applies to individual command execution;
# connect-timeout applies to initial connection establishment.
# Both are short so a Redis outage falls back to MongoDB quickly.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# Tomcat thread pool
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# Redis connection pool (Lettuce)
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2000ms

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# Set INTERNAL_TOKEN environment variable in production — never commit real secrets
internal.token=${INTERNAL_TOKEN:dev-only-change-in-production}

# Actuator — expose health endpoint only; full details for ops dashboards
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Swagger / OpenAPI — exclude /actuator from the API docs
springdoc.paths-to-exclude=/actuator/**

# Redis Streams
redis.stream.key=notifications_stream
redis.stream.consumer-group=notification-group
redis.stream.consumer-name=worker-${HOSTNAME:local}
